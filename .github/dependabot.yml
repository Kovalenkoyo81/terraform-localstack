---
version: 2
updates:
  # Actions are pinned by SHA — Dependabot bumps the SHA and the version comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Provider versions in .terraform.lock.hcl
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major provider upgrades have breaking changes and must match the
      # ~> constraints in modules/*/versions.tf — done by hand, not by a bot
      - dependency-name: hashicorp/aws
        update-types: ["version-update:semver-major"]
